<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoApp</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100">
    <div class="bg-white max-w-md mx-auto rounded-lg">
      <div class="bg-indigo-500 text-white p-5">
        <h1>Heading</h1>
      </div>
      <div class="p-5">
        <form id="todo-form" action="#" class="flex gap-5">
          <input id="todo-input" placeholder="Enter task description..." type="text" class="border flex-1 border-black p-2" />
          <button type="submit" class="px-5 text-white py-3 bg-violet-700">Add</button>
        </form>
        <div class="flex justify-between pt-6 pb-1 text-xs border-b border-black">
          <p>TASKS(1)</p>
          <p>COMPLETED : 1</p>
        </div>
        <ul id="todo-list" class="py-5">
          <!-- <li data-id="1" class="flex gap-2 border border-slate-300 p-4 rounded-xl">
            <input data-id="1" type="checkbox" name="" id="" />
            <p class="flex-1">Go To Gym</p>
            <div class="flex gap-2">
              <button data-id="1">Edit</button>
              <button data-id="1">Delete</button>
            </div>
          </li> -->
        </ul>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
